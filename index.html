<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#0E1B33">
    <title>复制刺绣文字</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "WenQuanYi Micro Hei", Arial, sans-serif;
            background: #F5F7FB;
            color: #0E1B33;
            line-height: 1.5;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---- Top app header bar (full-width, navy) ---- */
        .app-header {
            flex: 0 0 auto;
            background: linear-gradient(160deg, #1E3A5F 0%, #0E1B33 90%);
            padding: calc(15px + env(safe-area-inset-top)) 20px 15px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(14, 27, 51, 0.05);
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin: 0;
            color: #ffffff;
        }

        /* ---- Centered content area ---- */
        .app-main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            width: 100%;
            padding: 28px max(20px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        }

        .card {
            width: 100%;
            max-width: 360px;
            background: #ffffff;
            border: 1px solid #E7EBF3;
            border-radius: 16px;
            padding: 30px 24px 26px 24px;
            box-shadow: 0 1px 2px rgba(14, 27, 51, 0.05);
            text-align: center;
        }

        .card-index {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: #8593A8;
            margin: 0 0 16px 0;
        }

        /* Stacked identifier lines — each on its own padded row */
        .card-oid {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 20px;
            font-weight: 700;
            color: #0E1B33;
            letter-spacing: 0.02em;
            word-break: break-all;
            margin: 0;
        }

        .card-fabric {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 20px;
            font-weight: 700;
            color: #0E1B33;
            letter-spacing: 0.02em;
            word-break: break-all;
            margin: 12px 0 0 0;
        }

        .card-placement {
            font-size: 13px;
            font-weight: 500;
            color: #64748B;
            letter-spacing: 0.02em;
            word-break: break-word;
            margin: 16px 0 0 0;
        }

        .card-placement .placement-fallback {
            color: #8593A8;
            font-weight: 500;
        }

        .text-block {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 30px;
            font-weight: 500;
            line-height: 1.35;
            color: #0E1B33;
            background: #ECF0F7;
            border: 1px solid #DDE3EF;
            border-radius: 10px;
            padding: 22px 16px;
            margin: 24px 0 0 0;
            text-align: center;
            word-break: break-all;
            white-space: pre-wrap;
            letter-spacing: 0.01em;
            -webkit-user-select: all;
            user-select: all;
            transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .text-block.highlight {
            background: #E4EAF5;
            border-color: #1E3A5F;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.18);
            animation: pulse 1.6s ease-in-out 2;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.18); }
            50%      { box-shadow: 0 0 0 6px rgba(30, 58, 95, 0.28); }
        }

        .copy-btn {
            appearance: none;
            -webkit-appearance: none;
            display: block;
            width: 100%;
            min-height: 52px;
            padding: 14px 20px;
            margin: 22px 0 0 0;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #ffffff;
            background: linear-gradient(160deg, #1E3A5F 0%, #0E1B33 90%);
            border: 0;
            border-radius: 14px;
            box-shadow: 0 8px 18px rgba(14, 27, 51, 0.20);
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease, color 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .copy-btn:hover {
            background: linear-gradient(160deg, #17304f 0%, #0a1526 90%);
        }

        .copy-btn:active {
            background: linear-gradient(160deg, #12283f 0%, #080f1c 90%);
            transform: scale(0.985);
        }

        .copy-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.30);
        }

        .copy-btn.copied {
            background: #1B7A54;
            border-color: #1B7A54;
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(27, 122, 84, 0.20);
        }

        .copy-btn.manual {
            background: #F5F7FB;
            color: #0E1B33;
            border: 1px solid #DDE3EF;
            box-shadow: none;
            font-weight: 700;
        }

        .state-box {
            width: 100%;
            max-width: 360px;
            text-align: center;
            padding: 48px 24px;
            background: #ffffff;
            border: 1px dashed #DDE3EF;
            border-radius: 16px;
        }

        .state-box-title {
            font-size: 17px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #0E1B33;
        }

        .state-box-sub {
            font-size: 13px;
            color: #64748B;
            margin: 0;
            letter-spacing: 0.01em;
        }

        /* Keep font-size >= 16px on buttons to prevent iOS zoom-on-tap. */
        @media (max-width: 360px) {
            .text-block { font-size: 26px; padding: 20px 14px; }
            .app-title { font-size: 20px; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <h1 class="app-title">复制刺绣文字</h1>
    </header>
    <main id="app" class="app-main" aria-live="polite">
        <!-- Populated by JS -->
    </main>
    <script>
        (function () {
            'use strict';

            var app = document.getElementById('app');
            var params = new URLSearchParams(window.location.search);
            var encoded = params.get('t');

            if (!encoded) {
                renderEmpty(app);
                return;
            }

            var payload;
            try {
                payload = decodePayload(encoded);
                if (!Array.isArray(payload) || payload.length === 0) {
                    throw new Error('empty-or-not-array');
                }
            } catch (e) {
                renderError(app);
                return;
            }

            renderCards(app, payload);

            function decodePayload(raw) {
                // base64url -> base64
                var b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
                // Restore padding
                var pad = b64.length % 4;
                if (pad === 2) b64 += '==';
                else if (pad === 3) b64 += '=';
                else if (pad !== 0) throw new Error('bad-base64-length');

                var binary = atob(b64);
                // UTF-8 decode via the legacy-safe escape/decodeURIComponent pattern.
                // This is the most compatible path across older WebViews (WeChat Android,
                // older Chrome) where TextDecoder may be missing or quirky.
                var json;
                try {
                    json = decodeURIComponent(escape(binary));
                } catch (err) {
                    // Fallback: TextDecoder if available (newer browsers)
                    if (typeof TextDecoder !== 'undefined') {
                        var bytes = new Uint8Array(binary.length);
                        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        json = new TextDecoder('utf-8').decode(bytes);
                    } else {
                        throw err;
                    }
                }
                return JSON.parse(json);
            }

            function renderEmpty(root) {
                root.innerHTML = '';
                var box = document.createElement('div');
                box.className = 'state-box';
                var title = document.createElement('p');
                title.className = 'state-box-title';
                title.textContent = '未找到刺绣文字数据';
                var sub = document.createElement('p');
                sub.className = 'state-box-sub';
                sub.textContent = '请检查二维码';
                box.appendChild(title);
                box.appendChild(sub);
                root.appendChild(box);
            }

            function renderError(root) {
                root.innerHTML = '';
                var box = document.createElement('div');
                box.className = 'state-box';
                var title = document.createElement('p');
                title.className = 'state-box-title';
                title.textContent = '二维码数据无法读取';
                var sub = document.createElement('p');
                sub.className = 'state-box-sub';
                sub.textContent = '请重新扫描订单单据上的二维码';
                box.appendChild(title);
                box.appendChild(sub);
                root.appendChild(box);
            }

            function renderCards(root, items) {
                root.innerHTML = '';

                items.forEach(function (item, idx) {
                    var text = (item && typeof item.text === 'string') ? item.text : '';
                    if (!text) return; // skip empty entries defensively
                    var placement = (item && typeof item.placement === 'string') ? item.placement.trim() : '';
                    var productId = (item && typeof item.product_id === 'string') ? item.product_id.trim() : '';
                    var fabricCode = (item && typeof item.fabric_code === 'string') ? item.fabric_code.trim() : '';

                    var card = document.createElement('section');
                    card.className = 'card';

                    // Multi-monogram counter (only when more than one) — muted, above the meta.
                    if (items.length > 1) {
                        var indexTag = document.createElement('div');
                        indexTag.className = 'card-index';
                        indexTag.textContent = '第 ' + (idx + 1) + ' / ' + items.length + ' 条';
                        card.appendChild(indexTag);
                    }

                    // Identifier lines, each stacked on its own padded row:
                    // order id (prominent), then fabric code below it.
                    if (productId) {
                        var oidEl = document.createElement('div');
                        oidEl.className = 'card-oid';
                        oidEl.textContent = productId;
                        card.appendChild(oidEl);
                    }
                    if (fabricCode) {
                        var fabricEl = document.createElement('div');
                        fabricEl.className = 'card-fabric';
                        fabricEl.textContent = fabricCode;
                        card.appendChild(fabricEl);
                    }

                    var placementEl = document.createElement('h2');
                    placementEl.className = 'card-placement';
                    if (placement) {
                        placementEl.textContent = placement;
                    } else {
                        var span = document.createElement('span');
                        span.className = 'placement-fallback';
                        span.textContent = '刺绣位置未标注';
                        placementEl.appendChild(span);
                    }
                    card.appendChild(placementEl);

                    var textBlock = document.createElement('div');
                    textBlock.className = 'text-block';
                    textBlock.setAttribute('role', 'textbox');
                    textBlock.setAttribute('aria-readonly', 'true');
                    textBlock.setAttribute('tabindex', '0');
                    textBlock.textContent = text;
                    card.appendChild(textBlock);

                    var btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.type = 'button';
                    btn.textContent = '复制';
                    btn.setAttribute('data-default-label', '复制');
                    btn.addEventListener('click', function () {
                        copyToClipboard(text, btn, textBlock);
                    });
                    card.appendChild(btn);

                    root.appendChild(card);
                });
            }

            function markCopied(btn) {
                btn.classList.remove('manual');
                btn.classList.add('copied');
                btn.textContent = '✓ 已复制';
                setTimeout(function () {
                    btn.classList.remove('copied');
                    btn.textContent = btn.getAttribute('data-default-label') || '复制';
                }, 2000);
            }

            function markManualSelect(btn, textBlock) {
                btn.classList.remove('copied');
                btn.classList.add('manual');
                btn.textContent = '选择文本并长按复制';
                textBlock.classList.add('highlight');
                // Range-select the text block so the user sees the selection immediately.
                try {
                    var sel = window.getSelection();
                    if (sel) {
                        sel.removeAllRanges();
                        var range = document.createRange();
                        range.selectNodeContents(textBlock);
                        sel.addRange(range);
                    }
                } catch (e) { /* ignore; highlight class still draws the eye */ }
                setTimeout(function () {
                    textBlock.classList.remove('highlight');
                }, 3400);
            }

            async function copyToClipboard(text, btn, textBlock) {
                // Layer 1: modern Clipboard API
                if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                    try {
                        await navigator.clipboard.writeText(text);
                        markCopied(btn);
                        return;
                    } catch (e) { /* fall through */ }
                }

                // Layer 2: legacy execCommand('copy') via hidden textarea
                try {
                    var ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.top = '0';
                    ta.style.left = '-9999px';
                    ta.style.opacity = '0';
                    ta.style.pointerEvents = 'none';
                    document.body.appendChild(ta);
                    // iOS Safari needs explicit range selection on contenteditable/textarea
                    ta.focus();
                    ta.select();
                    if (ta.setSelectionRange) {
                        try { ta.setSelectionRange(0, text.length); } catch (e2) { /* ignore */ }
                    }
                    var ok = false;
                    try { ok = document.execCommand('copy'); } catch (e3) { ok = false; }
                    document.body.removeChild(ta);
                    if (ok) {
                        markCopied(btn);
                        return;
                    }
                } catch (e) { /* fall through */ }

                // Layer 3: manual-select fallback
                markManualSelect(btn, textBlock);
            }
        })();
    </script>
</body>
</html>
